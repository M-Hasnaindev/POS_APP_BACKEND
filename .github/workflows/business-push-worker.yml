name: Business push worker

on:
  schedule:
    # Offset the five-minute schedule away from the heavily loaded top-of-hour
    # boundary. Updating this expression also refreshes GitHub's scheduler after
    # the earlier authentication failures were fixed.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: business-push-worker
  # The running job dispatches its successor before it exits. Cancelling the
  # in-progress run makes an otherwise successful delivery appear failed and
  # triggers GitHub failure emails. Queue the successor instead.
  cancel-in-progress: false

jobs:
  deliver-notifications:
    runs-on: ubuntu-latest
    # The self-scheduling step intentionally waits 270 seconds. Leave enough
    # headroom for runner setup, the worker request, retries, and dispatch.
    timeout-minutes: 6
    steps:
      - name: Process pending business notifications
        env:
          PUSH_WORKER_URL: https://pos-app-backend-steel.vercel.app/api/notifications/process-push
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET repository secret is required."
            exit 1
          fi

          response_file="$(mktemp)"
          http_status="$(curl \
            --silent \
            --show-error \
            --retry 2 \
            --retry-all-errors \
            --max-time 180 \
            --output "$response_file" \
            --write-out "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$PUSH_WORKER_URL")"

          cat "$response_file"
          echo
          echo "Push worker HTTP status: $http_status"

          # Authentication/configuration errors must fail loudly. Tenant-level
          # 5xx responses are logged but allowed to retry on the next scheduled
          # run instead of causing GitHub to throttle a permanently red cron.
          if [ "$http_status" = "401" ] || [ "$http_status" = "403" ]; then
            exit 1
          fi
          if [ "$http_status" -lt 200 ] || [ "$http_status" -ge 600 ]; then
            exit 1
          fi

      - name: Schedule next worker run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # GitHub schedule events are best-effort and were being delayed for
          # hours. Keep a single deduplicated worker chain alive; the cron above
          # remains a watchdog that restarts it if a runner/network failure ever
          # breaks the chain.
          sleep 270
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 2 \
            --retry-all-errors \
            --max-time 60 \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/business-push-worker.yml/dispatches" \
            -d "{\"ref\":\"$DEFAULT_BRANCH\"}"
