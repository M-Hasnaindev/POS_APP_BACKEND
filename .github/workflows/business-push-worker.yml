name: Business push worker

on:
  schedule:
    # GitHub-hosted schedules support a minimum interval of five minutes.
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: business-push-worker
  cancel-in-progress: false

jobs:
  deliver-notifications:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Process pending business notifications
        env:
          PUSH_WORKER_URL: https://pos-app-backend-steel.vercel.app/api/notifications/process-push
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET repository secret is required."
            exit 1
          fi

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 2 \
            --retry-all-errors \
            --max-time 180 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$PUSH_WORKER_URL"
