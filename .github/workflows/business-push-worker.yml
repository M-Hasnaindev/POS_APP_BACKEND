name: Business push worker

on:
  schedule:
    # Offset the five-minute schedule away from the heavily loaded top-of-hour
    # boundary. Updating this expression also refreshes GitHub's scheduler after
    # the earlier authentication failures were fixed.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

concurrency:
  group: business-push-worker
  cancel-in-progress: false

jobs:
  deliver-notifications:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Process pending business notifications
        env:
          PUSH_WORKER_URL: https://pos-app-backend-steel.vercel.app/api/notifications/process-push
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET repository secret is required."
            exit 1
          fi

          response_file="$(mktemp)"
          http_status="$(curl \
            --silent \
            --show-error \
            --retry 2 \
            --retry-all-errors \
            --max-time 180 \
            --output "$response_file" \
            --write-out "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$PUSH_WORKER_URL")"

          cat "$response_file"
          echo
          echo "Push worker HTTP status: $http_status"

          # Authentication/configuration errors must fail loudly. Tenant-level
          # 5xx responses are logged but allowed to retry on the next scheduled
          # run instead of causing GitHub to throttle a permanently red cron.
          if [ "$http_status" = "401" ] || [ "$http_status" = "403" ]; then
            exit 1
          fi
          if [ "$http_status" -lt 200 ] || [ "$http_status" -ge 600 ]; then
            exit 1
          fi
